services:
  - type: web
    name: joes-meats
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/site
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data/joes-meats
    disk:
      name: joes-meats-data
      mountPath: /var/data
      sizeGB: 1
